name: security

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pasang gitleaks
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Imbas sejarah git
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

  checks:
    name: semakan repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tiada URL Apps Script / Spreadsheet ID dalam kod (IPD seksyen 6)
        run: |
          if grep -rEn "script\.google\.com/macros|spreadsheets/d/" apps shared functions config public-pages tools --exclude-dir=test; then
            echo "::error::Jumpa URL Apps Script atau Spreadsheet ID dalam kod"; exit 1
          fi
      - name: JSON sah
        run: for f in config/*.json apps/*/gas/appsscript.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: Build output
        run: bash tools/build.sh
      - name: Ujian
        run: node --test tools/test/*.test.js
